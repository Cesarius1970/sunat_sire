[package]
name = "sunat_sire"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["César A Vergara Buenaventura <cesarvergarab@gmail.com>"]
description = "Cliente y utilidades para la integración con el Sistema Integrado de Registros Electrónicos (SIRE) de SUNAT (Perú)."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["sunat", "sire", "peru", "facturacion", "contabilidad"]
categories = ["api-bindings", "web-programming", "finance"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["macros", "serde-with-str", "serde-with-float"] }
rust_decimal_macros = "1.36"
thiserror = "2.0"
tracing = "0.1"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
